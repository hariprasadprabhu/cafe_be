spring.datasource.url=jdbc:h2:mem:cafe;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long
app.jwt.access-minutes=15

spring.kafka.bootstrap-servers=localhost:9092
app.kafka.store-topic=cafe.orders.manipal

spring.flyway.enabled=false
