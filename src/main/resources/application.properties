spring.application.name=cafe

spring.datasource.url=jdbc:postgresql://localhost:5432/cafe
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=change-this-in-production-to-a-long-random-secret-at-least-32-chars
app.jwt.access-minutes=15

server.port=8080

spring.kafka.bootstrap-servers=localhost:9092
app.kafka.store-topic=cafe.orders.manipal
